<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4f55" />
    <meta name="description" content="نيو غزة: لعبة إعادة إعمار سلمية في المتصفح. أزل الأنقاض، ابنِ الأحياء، وأعد الحياة إلى الشوارع." />
    <title>نيو غزة — إعادة إعمار الأحياء</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preload" href="%BASE_URL%art/new-gaza-start-logo.webp" as="image" fetchpriority="high" />
    <link rel="preload" href="%BASE_URL%fonts/cairo-black.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      /* Keep the first paint styled while the game module and its CSS download. */
      html,body{margin:0;height:100%;background:#07182e}
      #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 20%,#224f82,#0c2442 60%,#07182e);color:#fff;transition:opacity .6s}
      #boot.done{opacity:0;pointer-events:none}
      .boot-card{text-align:center;width:min(320px,80vw);font-family:'Cairo Black',system-ui,sans-serif;font-weight:900}
      .boot-logo{display:block;width:78%;height:auto;max-height:min(44dvh,280px);object-fit:contain;margin:0 auto 16px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.3))}
      .boot-track{height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:14px}
      #boot-bar{height:100%;background:#f2d06b;transform:scaleX(0);transform-origin:right;transition:transform .2s}
      .boot-err{color:#ffd2c4;font-size:.9rem}
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <img class="boot-logo" src="%BASE_URL%art/new-gaza-start-logo.webp" alt="شعار نيو غزة — NEW GAZA" width="720" height="513" fetchpriority="high" />
        <p id="boot-msg">تحضير المدينة</p>
        <div class="boot-track"><div id="boot-bar"></div></div>
        <p id="boot-err" class="boot-err" hidden></p>
      </div>
    </div>
    <div id="stage" aria-label="خريطة الحي التفاعلية"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
